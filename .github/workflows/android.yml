name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          NFC_SWITCHER_KEYSTORE_BASE64: ${{ secrets.NFC_SWITCHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NFC_SWITCHER_KEYSTORE_BASE64" ]; then
            printf '%s' "$NFC_SWITCHER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nfcswitcher-release.jks"
          fi

      - name: Build release
        env:
          NFC_SWITCHER_KEYSTORE: ${{ secrets.NFC_SWITCHER_KEYSTORE_BASE64 != '' && format('{0}/nfcswitcher-release.jks', runner.temp) || '' }}
          NFC_SWITCHER_KEYSTORE_PASSWORD: ${{ secrets.NFC_SWITCHER_KEYSTORE_PASSWORD }}
          NFC_SWITCHER_KEY_ALIAS: ${{ secrets.NFC_SWITCHER_KEY_ALIAS }}
          NFC_SWITCHER_KEY_PASSWORD: ${{ secrets.NFC_SWITCHER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFCswitcher-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
