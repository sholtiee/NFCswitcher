plugins {
    id "com.android.application"
}

android {
    namespace "dev.codex.nfcswitcher"
    compileSdk 35

    defaultConfig {
        applicationId "dev.codex.nfcswitcher"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("NFC_SWITCHER_KEYSTORE")
            def storePasswordValue = System.getenv("NFC_SWITCHER_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("NFC_SWITCHER_KEY_ALIAS")
            def keyPasswordValue = System.getenv("NFC_SWITCHER_KEY_PASSWORD")

            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("NFC_SWITCHER_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}
